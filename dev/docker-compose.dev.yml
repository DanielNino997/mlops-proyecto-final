# Entorno SOLO de desarrollo del carril B. No se despliega: el despliegue real es k8s + Argo CD.
# MinIO: coollabsio/minio porque MinIO retiró minio/minio y minio/mc de Docker Hub (sep 2026).
services:
  postgres-data:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATA_DB_USER}
      POSTGRES_PASSWORD: ${DATA_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-data-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATA_DB_USER}"]
      interval: 5s
      retries: 10

  postgres-mlflow:
    image: postgres:16
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - pg_mlflow:/var/lib/postgresql/data
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER}"]
      interval: 5s
      retries: 10

  minio:
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    depends_on:
      postgres-mlflow: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./create_bucket.py:/opt/create_bucket.py:ro
    command: >
      bash -c "pip install --quiet psycopg2-binary boto3 &&
      python /opt/create_bucket.py &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres-mlflow:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts
      --serve-artifacts"
    ports: ["5000:5000"]

  data-api:
    image: cristiandiaz13/mlops-puj:data-api-pf-v2
    ports: ["8000:80"]

volumes:
  pg_data:
  pg_mlflow:
  minio_data:
