name: Imagen Airflow

on:
  push:
    branches: [main]
    paths: ["airflow/**", ".github/workflows/airflow-image.yml"]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-pf-airflow

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pruebas de lib/ (cliente, validaciones, decisión)
        run: |
          pip install -q pytest requests-mock -r airflow/requirements.txt
          python -m pytest airflow/tests -q

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: airflow
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
