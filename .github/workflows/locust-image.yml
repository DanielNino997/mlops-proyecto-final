name: Imagen Locust

on:
  push:
    paths: ["services/locust/**", ".github/workflows/locust-image.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-pf-locust
  MANIFEST: k8s/locust/deployment.yaml

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4



      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/locust
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  bump-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Actualizar el tag de la imagen en el manifiesto
        run: |
          sed -i -E "s#(image: .*/mlops-pf-locust:).*#\1${GITHUB_SHA}#" "$MANIFEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "deploy(locust): imagen ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
