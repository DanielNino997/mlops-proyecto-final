name: Imagen API

on:
  push:
    branches: [main]
    paths: ["services/api/**", "airflow/dags/lib/**", ".github/workflows/api-image.yml"]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-pf-api

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pruebas de la API (incluye paridad con el DAG y FastPredictor)
        run: |
          pip install -q pytest httpx matplotlib -r services/api/requirements.txt
          python -m pytest services/api/tests -q

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
