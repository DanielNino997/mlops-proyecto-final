    \        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{container=\\\"api\\\",namespace=\\\"mlops\\\",pod=~\\\"api-.*\\\"}[1m]))\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"type\": \"timeseries\",\n      \"title\": \"Memoria de la API\",\n      \"description\": \"Memoria en uso de cada réplica (cAdvisor). Límite por réplica: 1 GiB.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 12,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"custom\": {\n\
    \            \"lineWidth\": 2,\n            \"fillOpacity\": 10\n          },\n          \"min\": 0,\n          \"decimals\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (pod) (container_memory_working_set_bytes{container=\\\"api\\\",namespace=\\\"mlops\\\",pod=~\\\"api-.*\\\"})\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 9,\n      \"type\": \"timeseries\",\n      \"title\": \"Throttling de CPU de la API\",\n      \"description\": \"Fracción del tiempo en que el contenedor estuvo frenado por su límite de CPU.\",\n  \
    \    \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 20,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10\n          },\n          \"min\": 0,\n          \"max\": 1\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{container=\\\"api\\\",namespace=\\\
    \"mlops\\\",pod=~\\\"api-.*\\\"}[1m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{container=\\\"api\\\",namespace=\\\"mlops\\\",pod=~\\\"api-.*\\\"}[1m])), 1e-9)\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 10,\n      \"type\": \"timeseries\",\n      \"title\": \"Recargas del modelo\",\n      \"description\": \"Recargas del modelo desde MLflow (ok/error) en ventanas de 5 minutos.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 20,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10\n          },\n          \"min\": 0,\n          \"decimals\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n\
