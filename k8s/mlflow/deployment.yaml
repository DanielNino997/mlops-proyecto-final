# Servidor de MLflow: metadatos en postgres-mlflow, artefactos en MinIO (bucket mlflow-artifacts).
# --serve-artifacts: los clientes (Airflow, API) suben/bajan artefactos a través de MLflow,
# así que no necesitan credenciales de MinIO. El tag de la imagen lo actualiza el workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: dnino97/mlops-pf-mlflow:e2f188c4bbae151b1d7fda86eef7f696e8c4ef59
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=2
            - --backend-store-uri=$(MLFLOW_BACKEND_URI)
            - --artifacts-destination=s3://mlflow-artifacts
            - --serve-artifacts
          ports:
            - containerPort: 5000
          env:
            - name: MLFLOW_BACKEND_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-credentials
                  key: MLFLOW_BACKEND_URI
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
