# Crea el bucket de artefactos de MLflow. Hook PostSync de Argo CD: corre después de cada
# sincronización y es idempotente (--ignore-existing), así que repetirlo no cambia nada.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-crear-bucket
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
          command: ["sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "esperando a MinIO..."; sleep 3
              done
              mc mb --ignore-existing local/mlflow-artifacts
              mc ls local
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
